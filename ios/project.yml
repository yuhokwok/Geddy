name: QwenTTSiOS
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  QwenTTSiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: QwenTTSiOS/Sources
    resources:
      - path: QwenTTSiOS/Resources
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kwokyuho.aizhengziseng
        PRODUCT_NAME: AIZhengZiSeng
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: QwenTTSiOS/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
schemes:
  QwenTTSiOS:
    build:
      targets:
        QwenTTSiOS: all
